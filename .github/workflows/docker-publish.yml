name: Build and Push Portalarr

on:
  push:
    branches: [ "dev", "beta", "prod", "main", "stable" ] # Triggers on push to dev, beta, prod (plus legacy main/stable)
    tags: [ 'v*.*.*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub (optional, prevents rate limits if credentials configured)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve branch-specific container icon URL
        id: branch_icon
        run: |
          BRANCH="${{ github.ref_name }}"
          case "$BRANCH" in
            beta)
              ICON_URL="https://raw.githubusercontent.com/${{ github.repository }}/beta/public/icons/portalarr-beta.png"
              ;;
            dev|main)
              ICON_URL="https://raw.githubusercontent.com/${{ github.repository }}/dev/public/icons/portalarr-dev.png"
              ;;
            *)
              ICON_URL="https://raw.githubusercontent.com/${{ github.repository }}/prod/public/icons/portalarr-prod.png"
              ;;
          esac
          echo "icon_url=$ICON_URL" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            net.unraid.docker.icon=${{ steps.branch_icon.outputs.icon_url }}
            org.opencontainers.image.icon=${{ steps.branch_icon.outputs.icon_url }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=node:22-bookworm-slim
            GIT_BRANCH=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
            CONTAINER_ICON_URL=${{ steps.branch_icon.outputs.icon_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
